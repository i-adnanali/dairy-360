name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck            # shared + server
      - run: npm test -w server           # pure shaper tests, no DB/key
      - run: npm test -w web-angular      # Vitest (jsdom); CI=true is auto-set
      - run: npm run build -w web-angular
      # Regression & eval suite (Cycle 3). Runs against the live Anthropic API,
      # so it is gated on the secret: absent the key (forks, contributors), the
      # step is skipped visibly rather than failing CI -- the same
      # degrade-gracefully convention as GET /api/health. See docs/REGRESSION.md.
      - name: Regression suite (live model)
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: npm run test:regression -w server
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
