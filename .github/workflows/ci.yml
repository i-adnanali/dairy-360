name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck            # shared + server
      # Shaper, farm ingest/classify, and the animal registry (schema,
      # migrations, calving transaction, projections, invariants, HTTP routes).
      # No DB file and no API key: the registry suites use :memory: and the
      # suite as a whole writes nothing to disk.
      - run: npm test -w server
      - run: npm test -w web-angular      # Vitest (jsdom); CI=true is auto-set
      - run: npm run build -w web-angular
      # Regression & eval suite (Cycle 3). Runs against the live Anthropic API,
      # so it is gated on the secret: absent the key (forks, contributors), the
      # step is skipped visibly rather than failing CI -- the same
      # degrade-gracefully convention as GET /api/health. See docs/REGRESSION.md.
      #
      # ---------------------------------------------------------------------
      # WHY THE GATE IS TWO STEPS, AND NOT `if: secrets.X != ''`
      # ---------------------------------------------------------------------
      # It used to be exactly that, and it took the entire workflow down.
      # `secrets` is NOT among the contexts available in a step's `if` -- only
      # env, github, inputs, job, matrix, needs, runner, steps, strategy, vars.
      # GitHub rejects the whole FILE at validation, so from 2026-08-25 until
      # this was fixed every run failed in 0s with "workflow file issue" and
      # nothing ran at all: not the typecheck, not either test suite, not the
      # build. The guard written to keep this suite honest is what silenced
      # every other check in the file. Reproduce with `actionlint`, which names
      # it exactly; the GitHub UI only says "likely ... a workflow file issue".
      #
      # `steps.<id>.outputs` IS allowed in `if`, so presence is computed in its
      # own step. That has a second benefit: the secret stays out of every other
      # step's environment. A job-level `env:` would be shorter but would also
      # hand the key to `npm ci`, where any dependency's install script could
      # read it.
      - name: Is an API key available?
        id: apikey
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo '::notice::ANTHROPIC_API_KEY is set -- the live regression suite will run and will spend real tokens.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            # A warning, not a silent pass. docs/DEVELOPMENT.md § 5: "a skip is
            # not a pass" -- the whole reason that section exists is that this
            # suite reports `ok # SKIP` without a key, which reads as green.
            echo '::warning::ANTHROPIC_API_KEY is not set -- the live regression suite did NOT run. A skip is not a pass.'
          fi

      - name: Regression suite (live model)
        if: steps.apikey.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run test:regression -w server
