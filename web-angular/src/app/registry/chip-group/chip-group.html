
    <div
      role="radiogroup"
      [attr.aria-label]="label()"
      [attr.data-role]="name() + '-group'"
      [class]="vertical() ? 'space-y-1' : 'flex flex-wrap gap-2'"
      (keydown)="onKeydown($event)"
    >
      @for (o of options(); track o.value; let i = $index) {
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="value() === o.value"
          [attr.aria-label]="o.label"
          [attr.aria-describedby]="o.hint ? name() + '-hint-' + i : null"
          [attr.data-chip]="o.value"
          [attr.data-index]="i"
          [tabindex]="tabIndexFor(i)"
          (click)="changed.emit(o.value)"
          [class]="chipClass(o.value)"
        >
          <!-- The accelerator is PRINTED, not just implemented. A shortcut
               nobody can see is a shortcut nobody uses. -->
          @if (i < 9) {
            <span class="mr-1.5 font-mono text-xs opacity-60" data-role="chip-key">{{ i + 1 }}</span>
          }
          <!-- Sentence case: only the first letter is raised. "capitalize" on
               the button made every word a capital ("Only When They Come"). -->
          <span class="inline-block first-letter:uppercase">{{ o.label }}</span>
          @if (o.hint) {
            <span [id]="name() + '-hint-' + i" class="ml-2 text-xs">{{ o.hint }}</span>
          }
        </button>
      }
    </div>
