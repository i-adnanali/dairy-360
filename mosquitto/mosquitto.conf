# Minimal broker for the Cycle 7 live-camera validation window.
# See docs/cycle-7-live-camera-validation.md.
#
# ---------------------------------------------------------------------------
# DO NOT COPY THIS FILE INTO ANYTHING THAT OUTLIVES A TEST WINDOW.
# ---------------------------------------------------------------------------
# `allow_anonymous true` is an unauthenticated broker. It is acceptable here for
# exactly two reasons, both of which must hold:
#
#   1. docker-compose.frigate.yml binds this listener to 127.0.0.1 only, so it
#      is not reachable from the LAN even while running.
#   2. The stack is brought up for a defined capture window and torn down with
#      `down -v` afterwards.
#
# If you publish this port to 0.0.0.0, or leave the stack running, add a
# password file (`password_file` + `allow_anonymous false`) first.

listener 1883
allow_anonymous true

# Nothing needs to survive a restart -- the capture artifact is the JSONL file
# the host-side script writes, not anything the broker holds.
persistence false
log_dest stdout
