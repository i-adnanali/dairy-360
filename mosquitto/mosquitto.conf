# Minimal broker for the Cycle 7 live-camera validation window.
# See docs/cycle-7-live-camera-validation.md.
#
# Anonymous access is deliberate and scoped: open decision 3 accepts
# unauthenticated LAN access for this test window on a trusted home network.
# This stack is not to be left running past the window.

listener 1883
allow_anonymous true

# Nothing needs to survive a restart -- the capture artifact is the JSONL file
# the host-side script writes, not anything the broker holds.
persistence false
log_dest stdout
